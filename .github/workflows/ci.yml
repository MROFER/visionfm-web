name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visionfm
          POSTGRES_PASSWORD: visionfm
          POSTGRES_DB: visionfm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U visionfm"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://visionfm:visionfm@localhost:5432/visionfm
      PAYLOAD_SECRET: ci-secreto
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migraciones de cero sobre una base vacía
        run: pnpm migrate
      - name: Permisos por rol contra la base (tests de integración)
        run: pnpm test:int
      - name: Las migraciones cubren todo el esquema
        run: |
          pnpm migrate:create --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "Hay cambios en las colecciones sin migración: correr pnpm migrate:create y commitearla."
            exit 1
          fi
      - run: pnpm build

  # Una imagen por arquitectura, cada una en su propia máquina (compilar ARM emulado tarda demasiado):
  # amd64 para el VPS de producción y arm64 para el servidor gratis de Oracle de la demo.
  imagen:
    name: Imagen de Docker (${{ matrix.arq }})
    needs: verificar
    strategy:
      matrix:
        include:
          - arq: amd64
            runner: ubuntu-latest
          - arq: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arq }}
          # En los PR solo se comprueba que construye; en staging y main se sube sin tag y el paso
          # siguiente junta las dos arquitecturas bajo el tag de la rama
          outputs: ${{ github.event_name == 'push' && 'type=image,name=ghcr.io/mrofer/visionfm-web,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
          cache-from: type=gha,scope=imagen-${{ matrix.arq }}
          cache-to: type=gha,mode=max,scope=imagen-${{ matrix.arq }}
      - name: Guardar el digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arq }}
          path: /tmp/digests/*
          retention-days: 1

  publicar:
    name: Publicar la imagen
    needs: imagen
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags de la rama y del commit, con las dos arquitecturas
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/mrofer/visionfm-web:${{ github.ref_name }} \
            -t ghcr.io/mrofer/visionfm-web:${{ github.sha }} \
            $(printf 'ghcr.io/mrofer/visionfm-web@sha256:%s ' *)
