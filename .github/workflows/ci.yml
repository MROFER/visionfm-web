name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visionfm
          POSTGRES_PASSWORD: visionfm
          POSTGRES_DB: visionfm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U visionfm"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://visionfm:visionfm@localhost:5432/visionfm
      PAYLOAD_SECRET: ci-secreto
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migraciones de cero sobre una base vacía
        run: pnpm migrate
      - name: Permisos por rol contra la base (tests de integración)
        run: pnpm test:int
      - name: Las migraciones cubren todo el esquema
        run: |
          pnpm migrate:create --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "Hay cambios en las colecciones sin migración: correr pnpm migrate:create y commitearla."
            exit 1
          fi
      - run: pnpm build

  imagen:
    name: Imagen de Docker
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # En los PR solo se comprueba que construye; en staging y main se publica para que Coolify la descargue
          push: ${{ github.event_name == 'push' }}
          # En un PR, ref_name es "3/merge", que no es un tag válido
          tags: |
            ghcr.io/mrofer/visionfm-web:${{ github.event_name == 'push' && github.ref_name || 'pr' }}
            ghcr.io/mrofer/visionfm-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
